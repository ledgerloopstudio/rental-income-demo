<!DOCTYPE html>
<html lang="en" data-theme="hearth" data-font="mason">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#23282B">
<title>Rental Income Tracker — Brick &amp; Mortar (Free Demo)</title>
<style>
/* ============ BRICK & MORTAR · quiet-luxury fintech ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--r:14px;--r-s:10px}

/* --- themes: 2 dark, 2 light --- */
[data-theme="hearth"]{
  --bg:#23282B;--bg-soft:#1d2124;--surface:#2b3134;--surface-2:#353c41;--surface-3:#41484e;
  --text:#f4eee2;--muted:#b9ae9e;--faint:#7f7668;
  --accent:#c96f42;--accent-2:#a34a28;--accent-ink:#fff6e8;
  --line:rgba(244,238,226,.13);--line-strong:rgba(244,238,226,.26);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 16px 38px rgba(0,0,0,.42);
  --shadow-s:0 1px 2px rgba(0,0,0,.4),0 7px 18px rgba(0,0,0,.32);
  --good:#8fce9a;--bad:#e08a70;--warn:#dfb45e;--info:#93b4d8;
  --glow:0 0 0 3px rgba(201,111,66,.22);
  --paper-glow:radial-gradient(1100px 480px at 88% -8%,rgba(201,111,66,.10),transparent 60%);
}
[data-theme="ember"]{
  --bg:#1a1d1f;--bg-soft:#141617;--surface:#232728;--surface-2:#2c3133;--surface-3:#383e40;
  --text:#f1eadd;--muted:#b0a698;--faint:#756c5f;
  --accent:#d0874e;--accent-2:#b4552d;--accent-ink:#1d1208;
  --line:rgba(241,234,221,.12);--line-strong:rgba(241,234,221,.24);
  --shadow:0 1px 2px rgba(0,0,0,.55),0 16px 38px rgba(0,0,0,.48);
  --shadow-s:0 1px 2px rgba(0,0,0,.45),0 7px 18px rgba(0,0,0,.36);
  --good:#8fce9a;--bad:#e08a70;--warn:#d9a94f;--info:#93b4d8;
  --glow:0 0 0 3px rgba(208,135,78,.22);
  --paper-glow:radial-gradient(1100px 480px at 88% -8%,rgba(208,135,78,.08),transparent 60%);
}
[data-theme="cream"]{
  --bg:#FAF6EF;--bg-soft:#f2ebdb;--surface:#fffdf7;--surface-2:#f7f1e2;--surface-3:#eae0c8;
  --text:#23282B;--muted:#6e6559;--faint:#a29885;
  --accent:#B4552D;--accent-2:#8f3f20;--accent-ink:#fff7ec;
  --line:rgba(35,40,43,.13);--line-strong:rgba(35,40,43,.26);
  --shadow:0 1px 2px rgba(94,58,32,.12),0 16px 38px rgba(94,58,32,.14);
  --shadow-s:0 1px 2px rgba(94,58,32,.10),0 7px 18px rgba(94,58,32,.12);
  --good:#2e7a45;--bad:#b0472a;--warn:#9a6b1e;--info:#33608f;
  --glow:0 0 0 3px rgba(180,85,45,.18);
  --paper-glow:radial-gradient(1100px 480px at 88% -8%,rgba(180,85,45,.07),transparent 60%);
}
[data-theme="linen"]{
  --bg:#F5EEDF;--bg-soft:#ece2cc;--surface:#fffbef;--surface-2:#f4ecd8;--surface-3:#e6d9bc;
  --text:#2b2620;--muted:#6f6455;--faint:#a1967f;
  --accent:#A34A28;--accent-2:#7e3719;--accent-ink:#fff7ec;
  --line:rgba(43,38,32,.13);--line-strong:rgba(43,38,32,.26);
  --shadow:0 1px 2px rgba(94,58,32,.12),0 16px 38px rgba(94,58,32,.14);
  --shadow-s:0 1px 2px rgba(94,58,32,.10),0 7px 18px rgba(94,58,32,.12);
  --good:#2e7a45;--bad:#b0472a;--warn:#9a6b1e;--info:#33608f;
  --glow:0 0 0 3px rgba(163,74,40,.18);
  --paper-glow:radial-gradient(1100px 480px at 88% -8%,rgba(163,74,40,.07),transparent 60%);
}

/* --- fonts: 3 pairings, system stacks only --- */
[data-font="mason"]{--font-display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;--font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
[data-font="blueprint"]{--font-display:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
[data-font="porch"]{--font-display:"Avenir Next","Trebuchet MS","Segoe UI",Verdana,sans-serif;--font-body:"Avenir Next","Segoe UI","Trebuchet MS",Verdana,sans-serif;--font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

html{-webkit-text-size-adjust:100%}
body{background:var(--bg);background-image:var(--paper-glow);color:var(--text);font-family:var(--font-body);
  font-size:15px;line-height:1.6;min-height:100vh}
h1,h2,h3,.display{font-family:var(--font-display);font-weight:600;letter-spacing:-.01em;line-height:1.25}
.num{font-variant-numeric:tabular-nums lining-nums}
::selection{background:rgba(180,85,45,.30)}

/* ---------- app shell: sidebar + main ---------- */
.app{display:flex;min-height:100vh;align-items:stretch}
.side{width:264px;flex:none;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
  background:var(--bg-soft);border-right:1px solid var(--line);z-index:60}
.side-top{padding:22px 20px 16px;border-bottom:1px solid var(--line)}
.brand-row{display:flex;align-items:center;gap:12px}
.brand-tile{width:44px;height:44px;border-radius:12px;flex:none;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--accent),var(--accent-2));box-shadow:var(--shadow-s)}
.brand-tile svg{width:24px;height:24px}
.brand-name{font-family:var(--font-display);font-size:18px;line-height:1.25}
.brand-sub{font-size:10.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.side-actions{display:flex;gap:8px;margin-top:16px}
.side nav{flex:1;overflow-y:auto;padding:14px 12px}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 14px;margin-bottom:4px;
  border-radius:var(--r-s);border:1px solid transparent;background:transparent;color:var(--muted);
  font-family:var(--font-body);font-size:14px;font-weight:600;cursor:pointer;transition:all .16s ease;position:relative}
.nav-item:hover{color:var(--text);background:var(--surface)}
.nav-item.active{color:var(--text);background:var(--surface);border-color:var(--line-strong)}
.nav-item.active::before{content:"";position:absolute;left:-12px;top:10px;bottom:10px;width:4px;border-radius:4px;
  background:linear-gradient(180deg,var(--accent),var(--accent-2))}
.nav-item .dot{width:9px;height:9px;border-radius:50%;background:var(--faint);flex:none;transition:background .16s}
.nav-item.active .dot{background:var(--accent)}
.nav-item .cnt{margin-left:auto;font-size:11px;font-weight:800;background:var(--surface-3);color:var(--muted);
  border-radius:999px;padding:2px 9px}
.nav-item .cnt.hot{background:rgba(224,138,112,.18);color:var(--bad)}
.side-foot{padding:16px 20px;border-top:1px solid var(--line);font-size:12px;color:var(--faint)}
.side-foot .roll{font-family:var(--font-display);font-size:21px;color:var(--text);font-weight:600}
.main{flex:1;min-width:0}
.topbar{display:none}

/* ---------- layout ---------- */
.wrap{max-width:1140px;margin:0 auto;padding:30px 26px 100px}
.view-head{margin-bottom:24px}
.view-head .kicker{font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.view-head h2{font-size:30px}
.view-head p{color:var(--muted);font-size:14px;max-width:660px;margin-top:6px}
.view-head-row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1080px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* ---------- meters (stat blocks) ---------- */
.meter{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 20px 18px;
  box-shadow:var(--shadow-s);position:relative}
.meter::after{content:"";position:absolute;left:20px;right:20px;bottom:0;height:1px;background:var(--line)}
.meter .lbl{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.meter .val{font-family:var(--font-display);font-size:32px;font-weight:600;line-height:1.1}
.meter .sub{font-size:12.5px;color:var(--faint);margin-top:8px}
.meter.accent{border-color:rgba(180,85,45,.45)}
.meter.accent .val{color:var(--accent)}
.meter.danger{border-color:rgba(224,138,112,.5)}
.meter.danger .val{color:var(--bad)}

/* ---------- folio (property hero card) ---------- */
.folio{background:var(--surface);border:1px solid var(--line-strong);border-radius:18px;box-shadow:var(--shadow);
  overflow:hidden;margin-bottom:18px}
.folio-head{display:flex;gap:18px;align-items:flex-start;padding:22px 22px 18px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(180,85,45,.06),transparent)}
.initial{flex:none;width:64px;height:64px;border-radius:14px;display:grid;place-items:center;
  font-family:var(--font-display);font-size:26px;font-weight:700;color:var(--accent-ink);
  background:linear-gradient(140deg,var(--accent),var(--accent-2));box-shadow:var(--shadow-s);text-shadow:0 1px 2px rgba(0,0,0,.25)}
.folio-head .tt{flex:1;min-width:0}
.folio-head h3{font-size:21px}
.folio-head .addr{color:var(--muted);font-size:13.5px;margin-top:2px}
.folio-head .meta-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.folio-actions{display:flex;gap:8px;flex:none}
.folio-body{display:grid;grid-template-columns:1fr 1fr;gap:0}
.folio-sec{padding:18px 22px}
.folio-sec + .folio-sec{border-left:1px solid var(--line)}
.folio-sec.full{grid-column:1/-1;border-left:none;border-top:1px solid var(--line)}
.sec-lbl{font-size:10.5px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
.pnl{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pnl .cell .k{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pnl .cell .v{font-family:var(--font-display);font-size:21px;font-weight:600;margin-top:2px}
.pnl .cell .v.pos{color:var(--good)}
.pnl .cell .v.neg{color:var(--bad)}
.tenant-chip{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);
  border-radius:var(--r-s);background:var(--bg-soft);margin-bottom:8px;font-size:13.5px}
.tenant-chip .av{width:30px;height:30px;flex:none;border-radius:9px;display:grid;place-items:center;font-weight:800;
  font-size:13px;background:var(--surface-3);color:var(--accent)}
.tenant-chip .r{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
@media(max-width:700px){.folio-body{grid-template-columns:1fr}.folio-sec + .folio-sec{border-left:none;border-top:1px solid var(--line)}}

/* ---------- seals (status badges) ---------- */
.seal{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;padding:5px 12px;border-radius:999px;border:1px solid;white-space:nowrap}
.seal::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.seal.paid,.seal.done,.seal.full{color:var(--good);border-color:rgba(46,122,69,.45);background:rgba(46,122,69,.10)}
.seal.due,.seal.open,.seal.progress{color:var(--warn);border-color:rgba(154,107,30,.45);background:rgba(154,107,30,.10)}
.seal.overdue,.seal.vacant{color:var(--bad);border-color:rgba(176,71,42,.5);background:rgba(176,71,42,.10)}
.seal.partial{color:var(--info);border-color:rgba(51,96,143,.45);background:rgba(51,96,143,.10)}
.seal.idle{color:var(--muted);border-color:var(--line-strong);background:var(--surface-2)}
.seal.idle::before{background:var(--faint)}

/* ---------- alert banner ---------- */
.alert{display:flex;gap:14px;align-items:flex-start;border:1px solid rgba(176,71,42,.5);border-radius:var(--r);
  background:rgba(176,71,42,.08);padding:16px 20px;margin-bottom:20px;box-shadow:var(--shadow-s)}
.alert .ic{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--bad),#8f3f20);color:#fff;font-weight:800;font-size:18px}
.alert h3{font-size:16px}
.alert p{font-size:13.5px;color:var(--muted)}
.alert .go{margin-left:auto;flex:none;align-self:center}

/* ---------- cards / lists ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow-s)}
.card + .card{margin-top:16px}
.kicker{font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.lrow{display:flex;align-items:center;gap:14px;padding:13px 4px;border-bottom:1px solid var(--line);font-size:14px}
.lrow:last-child{border-bottom:none}
.lrow .grow{flex:1;min-width:0}
.lrow .t{font-weight:600}
.lrow .s{font-size:12.5px;color:var(--faint)}
.empty{padding:36px 20px;text-align:center;color:var(--faint);font-size:14px;border:1px dashed var(--line-strong);
  border-radius:var(--r);background:var(--bg-soft)}

/* ---------- aging buckets ---------- */
.buckets{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:6px}
@media(max-width:700px){.buckets{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bucket{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:14px;box-shadow:var(--shadow-s)}
.bucket .bl{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.bucket .bv{font-family:var(--font-display);font-size:22px;font-weight:600;margin-top:4px}
.bucket .bc{font-size:12px;color:var(--faint)}
.bucket.hot{border-color:rgba(176,71,42,.5)}
.bucket.hot .bv{color:var(--bad)}
.bucketbar{display:flex;height:14px;border-radius:999px;overflow:hidden;border:1px solid var(--line-strong);margin:14px 0 4px}
.bucketbar i{display:block;height:100%}
.bb-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:4px}
.bb-legend span{display:inline-flex;align-items:center;gap:6px}
.bb-legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* ---------- tables ---------- */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-s)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
  padding:11px 14px;border-bottom:1px solid var(--line-strong);background:var(--bg-soft);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(180,85,45,.05)}
td.r,th.r{text-align:right}
.row-actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.mini-btn{font-size:12px;font-weight:700;padding:7px 12px;border-radius:8px;border:1px solid var(--line-strong);
  background:var(--surface-2);color:var(--text);cursor:pointer;transition:all .15s;font-family:var(--font-body)}
.mini-btn:hover{border-color:var(--accent);color:var(--accent)}
.mini-btn.del:hover{border-color:var(--bad);color:var(--bad)}
.mini-btn.solid{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:var(--accent-ink)}
.mini-btn.solid:hover{color:var(--accent-ink);filter:brightness(1.06)}

/* ---------- category bars ---------- */
.cat-bar{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.cat-bar .nm{width:132px;flex:none;font-size:12.5px;font-weight:700;text-transform:capitalize;color:var(--muted)}
.cat-bar .bar{flex:1;height:9px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.cat-bar .bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent-2),var(--accent))}
.cat-bar .amt{width:92px;flex:none;text-align:right;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- forms ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.field .opt{font-size:11px;color:var(--faint);font-weight:600;text-transform:none;letter-spacing:0}
.input,select.input,textarea.input{width:100%;padding:12px 14px;border-radius:var(--r-s);border:1px solid var(--line-strong);
  background:var(--bg-soft);color:var(--text);font-family:var(--font-body);font-size:15px;transition:border-color .15s,box-shadow .15s}
textarea.input{resize:vertical;min-height:80px}
.input:focus{outline:none;border-color:var(--accent);box-shadow:var(--glow)}
select.input{appearance:none;-webkit-appearance:none;padding-right:38px;cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%23B4552D' stroke-width='2' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 14px center}
input[type="date"].input,input[type="number"].input{color-scheme:light}
[data-theme="hearth"] input[type="date"].input,[data-theme="hearth"] input[type="number"].input,
[data-theme="ember"] input[type="date"].input,[data-theme="ember"] input[type="number"].input{color-scheme:dark}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-body);font-size:14px;font-weight:700;
  padding:12px 20px;border-radius:var(--r-s);border:1px solid transparent;cursor:pointer;
  transition:transform .15s ease,box-shadow .15s ease,filter .15s}
.btn:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);box-shadow:var(--shadow-s)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:var(--shadow);filter:brightness(1.05)}
.btn-ghost{background:transparent;border-color:var(--line-strong);color:var(--text)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-danger{background:transparent;border-color:rgba(176,71,42,.55);color:var(--bad)}
.btn-danger:hover{background:rgba(176,71,42,.12)}
.btn-sm{padding:9px 15px;font-size:13px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.icon-btn{width:40px;height:40px;border-radius:11px;border:1px solid var(--line-strong);background:var(--surface);color:var(--text);
  display:grid;place-items:center;cursor:pointer;transition:all .15s}
.icon-btn:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow-s)}
.icon-btn svg{width:19px;height:19px}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.fbtn{font-size:12.5px;font-weight:700;padding:8px 14px;border-radius:999px;border:1px solid var(--line-strong);
  background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;font-family:var(--font-body)}
.fbtn:hover{color:var(--text);border-color:var(--accent)}
.fbtn.active{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);border-color:transparent}

/* ---------- modal / toast ---------- */
.modal-back{position:fixed;inset:0;background:rgba(10,8,6,.6);backdrop-filter:blur(4px);z-index:100;display:none;
  align-items:flex-start;justify-content:center;padding:34px 16px;overflow-y:auto}
.modal-back.open{display:flex}
.modal{width:100%;max-width:580px;background:var(--surface);border:1px solid var(--line-strong);border-radius:18px;
  box-shadow:var(--shadow);padding:26px;animation:pop .18s ease}
.modal.wide{max-width:760px}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal h3{font-size:21px;margin-bottom:4px}
.modal .sub{color:var(--muted);font-size:13.5px;margin-bottom:18px}
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);z-index:200;background:var(--surface);
  border:1px solid var(--accent);color:var(--text);padding:13px 22px;border-radius:12px;box-shadow:var(--shadow);
  font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s ease;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%)}

function daysOverdue(c){
  if (c.paidDate) return 0;

  return d < 0 ? -d : 0;
}

  const d = daysOverdue(c);

  const tenants = activeTenants(p.id);
  const rent = tenants.reduce((s, t) => s + Number(t.monthlyRent || 0), 0);
  const occupied = tenants.length;
  const units = Number(p.units || 1);
  const occ = units ? Math.round(occupied / units * 100) : 0;
  return {tenants, rent, occupied, units, occ};
}
function occupancyBadge(p){
  const s = propStats(p);
  if (s.occupied >= s.units && s.units > 0) return sealFor("full");
  if (s.occupied === 0) return sealFor("vacant");
  return '<span class="seal partial">Partial · '+s.occupied+'/'+s.units+'</span>';
}
function expensesFor(propertyId, period){ /* period: "YYYY-MM" or "YYYY" or null */
  return DB.expenses.filter(e =>
    (!propertyId || e.propertyId === propertyId) &&
    (!period || String(e.date || "").indexOf(period) === 0));
}
function expenseSum(propertyId, period){
  return expensesFor(propertyId, period).reduce((s, e) => s + Number(e.amount || 0), 0);
}
function grossFor(propertyId, period){ /* paid rent collected in period */
  return DB.charges.filter(c =>
    (!propertyId || c.propertyId === propertyId) &&
    c.paidDate && (!period || String(c.paidDate).indexOf(period) === 0)
  ).reduce((s, c) => s + Number(c.paidAmount || 0), 0);
}
function rentRoll(){ return activeTenants().reduce((s, t) => s + Number(t.monthlyRent || 0), 0); }
function occupancyPct(){
  const units = DB.properties.reduce((s, p) => s + Number(p.units || 1), 0);
  const occ = activeTenants().length;
  return {units, occ, pct: units ? Math.round(occ / units * 100) : 0};
}
function overdueCharges(){
  return DB.charges.filter(c => chargeStatus(c) === "overdue")
    .sort((a, b) => String(a.dueDate).localeCompare(String(b.dueDate)));
}
function tenantBalance(t){
  return DB.charges.filter(c => c.tenantId === t.id && chargeStatus(c) !== "paid")
    .reduce((s, c) => s + Number(c.amount || 0), 0);
}
function updateSideFoot(){
  const r = $("#sideRentRoll"), o = $("#sideOcc");
  if (r) r.textContent = money0(rentRoll()) + "/mo";
  if (o){ const oc = occupancyPct(); o.textContent = oc.pct + "% occupied · " + oc.occ + "/" + oc.units + " units"; }
}
function downloadFile(name, content, mime){
  const blob = new Blob([content], {type: mime || "text/plain"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

const VIEWS = [

  ["tax","Tax Reports"],["settings","Settings"],

function buildNav(){
  const mk = id => {

      if (v[0] === "collection"){ const n = overdueCharges().length; if (n) cnt = '<span class="cnt hot">'+n+'</span>'; }
      if (v[0] === "maintenance"){ const n = DB.maintenance.filter(m => m.status !== "done").length; if (n) cnt = '<span class="cnt">'+n+'</span>'; }
      return '<button class="nav-item" data-view="'+v[0]+'"><span class="dot"></span>'+v[1]+cnt+'</button>';

      b.addEventListener("click", () => { location.hash = "#/" + b.dataset.view; }));

}
function currentView(){
  const h = (location.hash || "").replace("#/","").replace("#","");
  return VIEWS.some(v => v[0] === h) ? h : "dashboard";
}
const RENDER = {};
const BIND = {};
function render(){
  const v = currentView();
  $$(".nav-item").forEach(b => b.classList.toggle("active", b.dataset.view === v));

  catch(e){ el.innerHTML = '<div class="card"><h3>Something went wrong</h3><p style="color:var(--muted)">This view could not be rendered.</p></div>'; }

/* ================= VIEW 4 · Rent Collection ================= */
let collFilter = "all";
RENDER.collection = function(){
  const od = overdueCharges();
  const buckets = BUCKETS.map((b, i) => {
    const list = i === 0
      ? DB.charges.filter(c => chargeStatus(c) !== "paid" && chargeStatus(c) !== "overdue")
      : DB.charges.filter(c => bucketOf(c) === b.id && chargeStatus(c) === "overdue");
    return {b, total: list.reduce((s, c) => s + Number(c.amount || 0), 0), count: list.length};
  });
  const maxB = Math.max(1, ...buckets.map(x => x.total));
  let rows = DB.charges.slice().sort((a, b) => String(a.dueDate).localeCompare(String(b.dueDate)));
  if (collFilter === "due") rows = rows.filter(c => chargeStatus(c) === "due");
  if (collFilter === "overdue") rows = rows.filter(c => chargeStatus(c) === "overdue");
  if (collFilter === "paid") rows = rows.filter(c => chargeStatus(c) === "paid");

  let html = '<div class="view-head"><div class="view-head-row"><div>' +
    '<div class="kicker">Follow the money</div><h2>Rent Collection</h2>' +
    '<p>Every rent charge, its status, and how long it has been waiting. Mark payments as they land.</p></div>' +
    '<button class="btn btn-primary btn-sm" id="addChargeBtn">+ Record new charge</button></div></div>';

  html += '<div class="card" style="margin-bottom:16px"><div class="kicker">Aging · unpaid charges</div>' +
    '<div class="bucketbar">' +
    buckets.map((x, i) => '<i style="width:'+(x.total/maxB*100)+'%;background:'+BUCKET_COLORS[i]+'" title="'+esc(x.b.label)+': '+money0(x.total)+'"></i>').join("") +
    '</div><div class="bb-legend">' +
    buckets.map((x, i) => '<span><i style="background:'+BUCKET_COLORS[i]+'"></i>'+esc(x.b.label)+'</span>').join("") +
    '</div><div class="buckets">';
  buckets.forEach((x, i) => {
    html += '<div class="bucket'+(i > 0 && x.total > 0 ? " hot" : "")+'"><div class="bl">'+esc(x.b.label)+'</div>' +
      '<div class="bv num">'+money0(x.total)+'</div><div class="bc">'+x.count+' charge'+(x.count===1?"":"s")+'</div></div>';
  });
  html += '</div></div>';

  html += '<div class="filter-row">' +
    [["all","All"],["due","Due"],["overdue","Overdue"],["paid","Paid"]].map(f =>
      '<button class="fbtn'+(collFilter===f[0]?" active":"")+'" data-cf="'+f[0]+'">'+f[1]+'</button>').join("") + '</div>';

  if (!rows.length) html += '<div class="empty">No charges match this filter.</div>';
  else {
    html += '<div class="card" style="padding:6px 18px"><div class="table-wrap" style="border:none"><table>' +
      '<thead><tr><th>Tenant</th><th>Property</th><th>Due date</th><th class="r">Days late</th><th class="r">Amount</th><th>Status</th><th class="r">Actions</th></tr></thead><tbody>';
    for (const c of rows){
      const t = tenantById(c.tenantId);
      const st = chargeStatus(c);
      const dl = daysOverdue(c);
      html += '<tr><td><strong>'+esc(t ? t.name : "—")+'</strong></td>' +
        '<td>'+esc(propName(c.propertyId))+'</td>' +
        '<td style="white-space:nowrap">'+fmtDate(c.dueDate)+'</td>' +
        '<td class="r num" style="color:'+(dl > 0 ? "var(--bad)" : "var(--faint)")+';font-weight:700">'+(dl > 0 ? dl : "—")+'</td>' +
        '<td class="r num"><strong>'+money(c.amount)+'</strong></td>' +
        '<td>'+sealFor(st)+'</td>' +
        '<td><div class="row-actions">' +
        (st !== "paid" ? '<button class="mini-btn solid" data-pay="'+c.id+'">Mark paid</button>' : '') +
        '<button class="mini-btn" data-cedit="'+c.id+'">Edit</button>' +
        '<button class="mini-btn del" data-crm="'+c.id+'">Delete</button></div></td></tr>';
    }
    html += '</tbody></table></div></div>';
  }
  return html;
};

    else Object.assign(DB.charges.find(x => x.id === c.id), obj);
    save(); closeModal(); render(); toast("Charge saved.");

function payModal(c, after){
  if (!c) return;
  const t = tenantById(c.tenantId);
  const remaining = Number(c.amount || 0) - (c.paidAmount || 0);
  openModal('<h3>Record payment</h3><p class="sub">'+esc(t ? t.name : "")+' · due '+fmtDate(c.dueDate)+' · '+money(c.amount)+'</p>' +
    '<div class="grid g2"><div class="field"><label>Amount received ($)</label>' +
    '<input class="input num" type="number" id="payAmt" min="0" step="0.01" value="'+remaining.toFixed(2)+'"></div>' +
    '<div class="field"><label>Date received</label><input class="input" type="date" id="payDate" value="'+todayISO()+'"></div></div>' +
    '<div class="field"><label>Method</label><select class="input" id="payMethod">' +
      METHODS.map(m => '<option>'+m+'</option>').join("") + '</select></div>' +
    '<div class="field"><label>Note <span class="opt">optional</span></label><input class="input" id="payNote" placeholder="e.g. late fee included"></div>' +
    '<div class="btn-row"><button class="btn btn-primary" id="paySave">Mark paid</button>' +
    '<button class="btn btn-ghost" id="payCancel">Cancel</button></div>');
  $("#payCancel").addEventListener("click", closeModal);
  $("#paySave").addEventListener("click", () => {
    const amt = parseFloat($("#payAmt").value);
    if (!(amt > 0)){ toast("Enter an amount greater than zero."); return; }
    c.paidDate = $("#payDate").value || todayISO();
    c.paidAmount = amt;
    c.method = $("#payMethod").value;
    const note = $("#payNote").value.trim();
    if (note) c.notes = (c.notes ? c.notes + " · " : "") + note;
    logActivity("Payment recorded — " + (t ? t.name : "") + " paid " + money(amt) + " for " + fmtDate(c.dueDate) + " rent (" + c.method + ").");
    save(); closeModal(); (after || render)(); toast("Payment recorded.");
  });
}

/* ================= VIEW 7 · Tax Reports ================= */
let taxYear = String(new Date().getFullYear());
function csvEsc(v){ return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"'; }
function reportCSV(yr){
  const lines = ["Property,Address,Gross Rental Income,Total Expenses,Net Income"];
  for (const p of DB.properties){
    const gross = grossFor(p.id, yr);
    const exp = expenseSum(p.id, yr);
    lines.push([csvEsc(p.name), csvEsc(p.address || ""), gross.toFixed(2), exp.toFixed(2), (gross - exp).toFixed(2)].join(","));
  }
  return lines.join("\n");
}
function accountantCSV(yr){
  const lines = ["Type,Date,Property,Tenant/Category,Amount,Method,Notes"];
  for (const c of DB.charges.filter(c => c.paidDate && yearKey(c.paidDate) === yr)
    .sort((a, b) => String(a.paidDate).localeCompare(String(b.paidDate)))){
    const t = tenantById(c.tenantId);
    lines.push(["Rental income", c.paidDate, csvEsc(propName(c.propertyId)), csvEsc(t ? t.name : ""),
      Number(c.paidAmount || 0).toFixed(2), csvEsc(c.method || ""), csvEsc(c.notes || "")].join(","));
  }
  for (const e of DB.expenses.filter(e => yearKey(e.date) === yr)
    .sort((a, b) => String(a.date).localeCompare(String(b.date)))){
    lines.push(["Expense", e.date, csvEsc(propName(e.propertyId)), csvEsc(e.category),
      Number(e.amount || 0).toFixed(2), "", csvEsc(e.note || "")].join(","));
  }
  return lines.join("\n");
}

/* ================= self-test (?qa=selftest) ================= */
function runSelfTest(){
  const results = [];
  const snap = JSON.stringify(DB);
  const ok = (name, cond, detail) => results.push({name, pass: !!cond, detail: detail || ""});
  try {
    /* 1. storage round-trip */
    save();
    let parsed = null;
    try { parsed = JSON.parse(localStorage.getItem(STORE_KEY)); } catch(e){}
    ok("Storage round-trip", !!(parsed && parsed.settings && Array.isArray(parsed.properties) && Array.isArray(parsed.tenants)),
      parsed ? "key present, properties + tenants parsed" : "localStorage read failed");

    /* 2. all 8 views render */
    let navOk = true, navDetail = [];
    for (const v of VIEWS){
      try {
        const html = RENDER[v[0]]();
        if (!html || html.length < 300){ navOk = false; navDetail.push(v[0] + ":empty"); }
      } catch(e){ navOk = false; navDetail.push(v[0] + ":" + e.message); }
    }
    ok("All 8 views render", navOk, navOk ? "8/8 views produced markup" : navDetail.join("; "));

    /* 3. theme toggle flips + persists */
    const before = DB.settings.theme;
    toggleDarkLight();
    const after = DB.settings.theme;
    const reloaded = JSON.parse(localStorage.getItem(STORE_KEY)).settings.theme;
    ok("Theme toggle flips & persists", after !== before && reloaded === after,
      before + " → " + after + " (stored: " + reloaded + ")");
    DB.settings.theme = before; save(); applySettings();

    /* 4. font switch applies */
    const fBefore = DB.settings.font;
    DB.settings.font = fBefore === "mason" ? "blueprint" : "mason";
    applySettings();
    ok("Font switch applies", document.documentElement.getAttribute("data-font") === DB.settings.font,
      "data-font=" + document.documentElement.getAttribute("data-font"));
    DB.settings.font = fBefore; applySettings();

    /* 5. CRUD: property */
    const p0 = DB.properties.length;
    const np = {id: "qa-p", name: "QA House", address: "1 QA Lane", units: 1, type: "Single-family", notes: ""};
    DB.properties.push(np); save();
    let okAdd = DB.properties.length === p0 + 1 && propById("qa-p");
    Object.assign(propById("qa-p"), {name: "QA House 2"});
    let okEdit = propById("qa-p").name === "QA House 2";
    DB.properties = DB.properties.filter(x => x.id !== "qa-p");
    let okDel = !propById("qa-p") && DB.properties.length === p0;
    ok("Property add/edit/delete", okAdd && okEdit && okDel, "add:" + okAdd + " edit:" + okEdit + " del:" + okDel);

    /* 6. CRUD: tenant */
    const t0 = DB.tenants.length;
    DB.tenants.push({id: "qa-t", name: "QA Renter", propertyId: (DB.properties[0]||{}).id, unit: "U1", monthlyRent: 999,
      leaseStart: "2026-01-01", leaseEnd: "2026-12-31", status: "active", phone: "", email: "", notes: ""});
    let tAdd = DB.tenants.length === t0 + 1;
    Object.assign(tenantById("qa-t"), {monthlyRent: 1000});
    let tEdit = tenantById("qa-t").monthlyRent === 1000;
    DB.tenants = DB.tenants.filter(x => x.id !== "qa-t");
    ok("Tenant add/edit/delete", tAdd && tEdit && !tenantById("qa-t"), "add:" + tAdd + " edit:" + tEdit);

    /* 7. CRUD: expense */
    const e0 = DB.expenses.length;
    DB.expenses.push({id: "qa-e", propertyId: (DB.properties[0]||{}).id, date: "2026-09-01", category: "repairs", amount: 50, note: "qa"});
    let eAdd = DB.expenses.length === e0 + 1;
    Object.assign(DB.expenses.find(x => x.id === "qa-e"), {amount: 60});
    let eEdit = DB.expenses.find(x => x.id === "qa-e").amount === 60;
    DB.expenses = DB.expenses.filter(x => x.id !== "qa-e");
    ok("Expense add/edit/delete", eAdd && eEdit && DB.expenses.length === e0, "add:" + eAdd + " edit:" + eEdit);

    /* 8. CRUD: maintenance */
    const m0 = DB.maintenance.length;
    DB.maintenance.push({id: "qa-m", propertyId: (DB.properties[0]||{}).id, title: "QA leak", description: "",
      cost: 10, dateReported: "2026-09-01", status: "open", vendor: ""});
    let mAdd = DB.maintenance.length === m0 + 1;
    Object.assign(DB.maintenance.find(x => x.id === "qa-m"), {status: "done"});
    let mEdit = DB.maintenance.find(x => x.id === "qa-m").status === "done";
    DB.maintenance = DB.maintenance.filter(x => x.id !== "qa-m");
    ok("Maintenance add/edit/delete", mAdd && mEdit && DB.maintenance.length === m0, "add:" + mAdd + " edit:" + mEdit);

    /* 9. aging bucket math: 64 days → 61–90 */
    const fake = {dueDate: "2026-08-01", paidDate: null, amount: 1450};
    const bd = daysOverdue(fake);
    ok("Aging bucket math", bd === 64 && bucketOf(fake) === "b3",
      "2026-08-01 → " + bd + " days overdue → bucket " + bucketOf(fake));

    /* 10. charge status transitions */
    const c0 = {dueDate: "2099-01-01", paidDate: null};
    const c1 = {dueDate: "2026-01-01", paidDate: null};
    const c2 = {dueDate: "2026-01-01", paidDate: "2026-01-02", paidAmount: 100, method: "cash"};
    ok("Charge statuses", chargeStatus(c0) === "due" && chargeStatus(c1) === "overdue" && chargeStatus(c2) === "paid",
      "due/overdue/paid all classify correctly");

    /* 11. CSV exports have content */
    const rc = reportCSV("2026"), ac = accountantCSV("2026");
    ok("Report CSV content", rc.indexOf("Property,Address,Gross Rental Income") === 0 && rc.split("\n").length > 1,
      (rc.split("\n").length - 1) + " property rows");
    ok("Accountant CSV content", ac.indexOf("Type,Date,Property") === 0 && ac.split("\n").length > 1,
      (ac.split("\n").length - 1) + " transaction rows");

    /* 12. disclaimer present */
    ok("Disclaimer present", DISCLAIMER_HTML.indexOf("not tax advice") > -1, "disclaimer string included");

    /* 13. occupancy math on seed */
    const oc = occupancyPct();
    ok("Occupancy math", oc.units === 4 && oc.occ === 3 && oc.pct === 75,
      oc.occ + "/" + oc.units + " units = " + oc.pct + "%");

    /* 14. sample-data clear removes seeds but keeps structure */
    const snapDb = JSON.parse(JSON.stringify(DB));
    const seedIds = ["p-maple","p-oak","p-cedar"];
    DB.properties = DB.properties.filter(p => !seedIds.includes(p.id));
    const clearedOk = !DB.properties.some(p => seedIds.includes(p.id)) && Array.isArray(DB.tenants);
    DB = snapDb;
    ok("Sample-data clear logic", clearedOk, "seed property ids removed, collections intact");
  } catch(e){
    results.push({name: "Self-test harness", pass: false, detail: "exception: " + e.message});
  }
  DB = JSON.parse(snap); save(); applySettings(); buildNav();

  const passed = results.filter(r => r.pass).length;
  const html = '<div class="view-head"><div><div class="kicker">Quality assurance</div><h2>Self-Test Results</h2>' +
    '<p>'+passed+' of '+results.length+' assertions passed. State was snapshotted and restored.</p></div>' +
    '<button class="btn btn-ghost btn-sm" id="qaBack">Back to app</button></div>' +
    '<div class="card"><div class="kicker">qa=selftest · ' + new Date().toLocaleString() + '</div>' +
    results.map(r => '<div class="test-row"><span class="badge '+(r.pass?"pass":"fail")+'">'+(r.pass?"PASS":"FAIL")+'</span>' +
      '<div><strong>'+esc(r.name)+'</strong><div class="detail">'+esc(r.detail)+'</div></div></div>').join("") +
    '</div>';
  const sn = $("#sideNav"); if (sn) sn.style.display = "none";
  const tn = $("#topNav"); if (tn) tn.style.display = "none";
  $("#view").innerHTML = html;
  $("#qaBack").addEventListener("click", () => {
    if (sn) sn.style.display = ""; if (tn) tn.style.display = "";
    render();
  });
  console.log("SELFTEST " + passed + "/" + results.length + " passed");
}

<script>
(function(){
  var DEMO_LIMIT = 10;
  var DEMO_MSG = "Demo limit reached (10 entries). Get the full version on Etsy for unlimited entries!";
  var addCount = 0;
  function isAddButton(el){
    if (!el || !el.textContent) return false;
    var t = el.textContent.trim().toLowerCase();
    if (t.indexOf('theme') > -1 || t.indexOf('font') > -1 || t.indexOf('mode') > -1) return false;
    var addWords = ['add', 'save', 'create'];
    for (var i = 0; i < addWords.length; i++){
      if (t === addWords[i] || t.indexOf(addWords[i]+' ') === 0) return true;
    }
    if (t === '+') return true;
    return false;
  }
  function showMsg(){
    try { if (typeof toast === 'function') toast(DEMO_MSG); else alert(DEMO_MSG); }
    catch(e){ alert(DEMO_MSG); }
  }
  function updateCounter(){
    var c = document.getElementById('demo-entry-counter');
    if (c) c.textContent = addCount + '/' + DEMO_LIMIT + ' entries used';
  }
  document.addEventListener('click', function(e){
    var btn = e.target.closest ? e.target.closest('button,input[type="submit"],input[type="button"]') : null;
    if (!btn || !isAddButton(btn)) return;
    if (addCount >= DEMO_LIMIT) {
      e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
      showMsg(); return false;
    }
    addCount++; updateCounter();
  }, true);
  document.addEventListener('submit', function(e){
    if (addCount >= DEMO_LIMIT) {
      e.preventDefault(); e.stopPropagation(); showMsg(); return false;
    }
    addCount++; updateCounter();
  }, true);
})();
</script>
<!-- ===== /DEMO LIMIT ===== -->

</body>
</html>
